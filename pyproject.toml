[project]
name = "gvu"
version = "0.3.0"
description = "Python automation for GaussView 6 on macOS"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Giovanni Gravili"}]
keywords = ["gaussview", "gaussian", "chemistry", "visualization", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "scikit-image>=0.25,<1",
    "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
]

[project.urls]
Documentation = "https://ghovax.github.io/gvu/"
Repository = "https://github.com/ghovax/gvu"
Issues = "https://github.com/ghovax/gvu/issues"

[dependency-groups]
dev = ["ruff>=0.12", "twine>=6"]

[project.optional-dependencies]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
    "sphinx-rtd-theme>=3,<4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF022", "RUF059"]
